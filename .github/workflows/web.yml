name: Web and workers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm --prefix worker ci
      # Lint, typecheck, all tests and production builds for the web app and both workers.
      - run: npm run check
