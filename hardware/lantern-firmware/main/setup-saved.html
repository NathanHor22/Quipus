<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quipus settings saved</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:26px;background:#fff;color:#0e203a;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:440px;width:100%}.brand{margin:0 0 24px;font-weight:750;font-size:21px;letter-spacing:.18em}.panel{position:relative;padding:29px;border:1px solid #dce1e8;box-shadow:0 15px 45px #0e203a0a}.panel::before{content:"";position:absolute;right:-1px;top:-1px;width:54px;height:5px;background:#c40000}.check{display:grid;place-items:center;width:42px;height:42px;margin-bottom:18px;border:1px solid #a7cbb6;background:#f0f7f3;color:#187448;font-size:23px}h1{margin:0 0 13px;font-size:27px;line-height:1.2;letter-spacing:-.04em}p{margin:0 0 15px;color:#526174}strong{color:#0e203a}.next{margin:21px 0 0;border-top:1px solid #dce1e8;padding-top:17px;font-size:12px}footer{margin-top:18px;color:#526174;font-size:11px}@media(max-width:360px){body{padding:20px}.panel{padding:23px}}
</style>
</head>
<body>
<main class="shell"><div class="brand">QUIPUS</div><section class="panel"><div class="check" aria-hidden="true">&#10003;</div><h1>Settings saved.</h1><p>Quipus is restarting. <strong>Keep it powered on.</strong></p><p>Check the recorder screen for Wi-Fi and pairing confirmation.</p><p class="next">Reconnect this phone or laptop to your normal internet, then return to the Quipus dashboard. You can close this page.</p></section><footer>Your conversations. Connected.</footer></main>
</body>
</html>
